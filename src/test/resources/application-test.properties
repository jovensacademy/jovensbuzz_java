# Test profile: isolated database on the same local MySQL/MariaDB (XAMPP).
# Never points at the development database, so tests cannot touch real enquiries.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/jovens_buzz_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.flyway.clean-disabled=false

app.bootstrap.admin.username=test_admin
app.bootstrap.admin.password=Test-Password#2026
app.bootstrap.admin.email=test-admin@example.com

# Never call Google in automated tests
app.google.sheets.spreadsheet-id=
app.google.sheets.credentials-path=
app.google.sheets.web-app-url=
app.google.sheets.secret-token=
app.google.sheets.spreadsheet-name=
app.sync.initial-delay-ms=3600000

# Generous limits so tests are not throttled (rate limiter has its own unit test)
app.rate-limit.enquiry.max-requests=1000
app.rate-limit.login.max-requests=1000

# Never send real email in automated tests (SMTP unconfigured; senders are mocked in unit tests)
app.mail.enabled=false
spring.mail.host=
app.mail.from-email=
app.mail.initial-delay-ms=3600000
